<style>
  html, body { margin: 0; height: 100%; background: rgb(248,249,250); }
  body { font-family: "Noto Sans Thai", "Prompt", system-ui, sans-serif; }
  .loading {
    position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; color: rgb(95,99,104); font-size: 15px;
  }
  .loading img { width: 72px; height: 72px; border-radius: 50%; animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 50% { transform: scale(.92); opacity: .7; } }
  .loading a { color: rgb(26,115,232); font-size: 13px; }
  iframe {
    position: fixed; inset: 0; width: 100%; height: 100%; height: 100dvh; border: 0; display: block;
    background: transparent;
  }
  @media (prefers-color-scheme: dark) {
    html, body { background: rgb(32,33,36); }
    .loading { color: rgb(154,160,166); }
    .loading a { color: rgb(138,180,248); }
  }
</style>
</head>
<body>
<div class="loading" aria-hidden="true">
  <img src="https://raw.githubusercontent.com/odto-skpcm/logo/main/OdtoCb512.png" alt="">

  <a id="direct" href="https://script.google.com/macros/s/AKfycby7bHO2Nz75ZMoGMUihTpg5H6_hnofRgfq99vGbIrJ12QUEUYCKQZQJzs_ldfNh4hzk/exec">เปิดไม่ขึ้น? คลิกที่นี่</a>

<iframe id="app" title="แฟ้มสะสมผลงาน ครูวิชัย สิงห์น้อย" allow="clipboard-write; fullscreen; web-share"></iframe>

</noscript>
<script>
  // หน้าห่อ (GitHub Pages) — ฝังเว็บแอป Apps Script เต็มจอ · ส่งต่อเฉพาะพารามิเตอร์ที่ระบบรู้จัก (?v=app เปิดหลังบ้าน)
  (function () {
    var APP = 'https://script.google.com/macros/s/AKfycby7bHO2Nz75ZMoGMUihTpg5H6_hnofRgfq99vGbIrJ12QUEUYCKQZQJzs_ldfNh4hzk/exec';
    var src = APP, q = new URLSearchParams(location.search), keep = new URLSearchParams();
    if (q.get('v') === 'app') keep.set('v', 'app');
    var s = keep.toString();
    if (s) src += '?' + s;
    document.getElementById('direct').href = src;
    document.getElementById('app').src = src;
  })();
</script>
